name: Cove Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/setup-cove]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cove-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      POCKETCHAT_UPDATE_REPO: https://github.com/${{ github.repository }}
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore original verified 3D Imposter from Cove 1.7.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = if (Test-Path 'C:\Program Files\7-Zip\7z.exe') { 'C:\Program Files\7-Zip\7z.exe' } else { (Get-Command 7z -ErrorAction Stop).Source }
          $installer = Join-Path $env:RUNNER_TEMP 'Cove-1.7.0-Setup-x64.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'cove-3d-source'
          New-Item -Force -ItemType Directory -Path $folder | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/ykjudah/cove/releases/download/v1.7.0/Cove-1.7.0-Setup-x64.exe' -OutFile $installer
          & $seven x -y "-o$folder" $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract original Cove 1.7.0 installer' }
          $asar = Get-ChildItem $folder -Recurse -File -Filter app.asar | Select-Object -First 1
          if (-not $asar) {
            $archives = @(Get-ChildItem $folder -Recurse -File -Filter '*.7z')
            $i=0
            foreach ($archive in $archives) {
              $target=Join-Path $env:RUNNER_TEMP "cove-3d-payload-$i"
              & $seven x -y "-o$target" $archive.FullName | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed unpacking $($archive.FullName)" }
              $asar = Get-ChildItem $target -Recurse -File -Filter app.asar | Select-Object -First 1
              if ($asar) { break }
              $i++
            }
          }
          if (-not $asar) { throw 'Original 3D app.asar not found in historical installer' }
          node scripts/restore-imposter-3d.cjs $asar.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test
      - name: Check release tag and signing configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
          if (-not $env:POCKETCHAT_UPDATE_SIGNING_KEY) { throw 'Missing POCKETCHAT_UPDATE_SIGNING_KEY repository secret' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign trusted build when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          if ($env:POCKETCHAT_UPDATE_SIGNING_KEY) {
            npm run sign-update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'Unsigned test build only. Add the existing signing key before tagging a release.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: dist
      - name: Prepare draft release for final verification
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml

  # One-time 2.8.2 release: require passing Windows tests and existing
  # pinned-key updater signing. Older tags and future versions are untouched.
  release_optimization_282:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: dist
      - name: Verify and publish Cove 2.8.2 signed assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v2.8.2 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Cove 2.8.2 already released; not overwriting it."
            exit 0
          fi
          test -s dist/Cove-2.8.2-Setup-x64.exe
          test -s dist/Cove-2.8.2-Setup-x64.exe.blockmap
          test -s dist/latest.yml
          grep -Eq '^version: [^[:alnum:]]?2[.]8[.]2[^[:alnum:]]?$' dist/latest.yml || {
            echo "Wrong updater version; cannot publish"; exit 1;
          }
          grep -Eq '^pocketchatSignature: .+' dist/latest.yml || {
            echo "Unsigned updater manifest; cannot publish"; exit 1;
          }
          cat > "$RUNNER_TEMP/cove-2.8.2-notes.md" <<'RELEASE_NOTES'
          ## Cove 2.8.2 — Optimization Update

          Faster conversations and reduced Supabase traffic, without deleting messages.

          ### Messaging
          - Load the newest 50 messages first and older history on scroll
          - Cache recent conversations for faster switching
          - Recover missed messages after reconnecting
          - Preserve replies, reactions, attachments and read receipts

          ### Performance and multiplayer
          - Reduce duplicate background requests
          - Cache profile pictures and group images
          - Improve room, friends, calls and presence sync efficiency
          - Reduce idle-game checks, while preserving fast updates for joined players
          - Keep the original 3D Keel Imposter game and smooth movement

          ### Installation
          Cove can automatically update existing compatible installations to v2.8.2.
          The release includes the Windows installer, blockmap and signed update manifest.
          RELEASE_NOTES
          gh release create v2.8.2 \
            dist/Cove-2.8.2-Setup-x64.exe \
            dist/Cove-2.8.2-Setup-x64.exe.blockmap \
            dist/latest.yml \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Cove v2.8.2 — Optimization Update" \
            --notes-file "$RUNNER_TEMP/cove-2.8.2-notes.md" \
            --latest
