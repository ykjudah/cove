name: Cove Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/setup-cove, release-prep/v2.8.1]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cove-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      POCKETCHAT_UPDATE_REPO: https://github.com/${{ github.repository }}
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore original verified 3D Imposter from Cove 1.7.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seven = if (Test-Path 'C:\Program Files\7-Zip\7z.exe') { 'C:\Program Files\7-Zip\7z.exe' } else { (Get-Command 7z -ErrorAction Stop).Source }
          $installer = Join-Path $env:RUNNER_TEMP 'Cove-1.7.0-Setup-x64.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'cove-3d-source'
          New-Item -Force -ItemType Directory -Path $folder | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/ykjudah/cove/releases/download/v1.7.0/Cove-1.7.0-Setup-x64.exe' -OutFile $installer
          & $seven x -y "-o$folder" $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract original Cove 1.7.0 installer' }
          $asar = Get-ChildItem $folder -Recurse -File -Filter app.asar | Select-Object -First 1
          if (-not $asar) {
            $archives = @(Get-ChildItem $folder -Recurse -File -Filter '*.7z')
            $i=0
            foreach ($archive in $archives) {
              $target=Join-Path $env:RUNNER_TEMP "cove-3d-payload-$i"
              & $seven x -y "-o$target" $archive.FullName | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed unpacking $($archive.FullName)" }
              $asar = Get-ChildItem $target -Recurse -File -Filter app.asar | Select-Object -First 1
              if ($asar) { break }
              $i++
            }
          }
          if (-not $asar) { throw 'Original 3D app.asar not found in historical installer' }
          node scripts/restore-imposter-3d.cjs $asar.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test
      - name: Check release tag and signing configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
          if (-not $env:POCKETCHAT_UPDATE_SIGNING_KEY) { throw 'Missing POCKETCHAT_UPDATE_SIGNING_KEY repository secret' }
      - name: Verify signing is configured for the 2.8.1 draft
        if: github.ref == 'refs/heads/release-prep/v2.8.1'
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          if ((Get-Content package.json | ConvertFrom-Json).version -ne '2.8.1') { throw 'Unexpected release version' }
          if (-not $env:POCKETCHAT_UPDATE_SIGNING_KEY) { throw 'Missing updater signing key: cannot prepare a trusted release' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign trusted build when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          if ($env:POCKETCHAT_UPDATE_SIGNING_KEY) {
            npm run sign-update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'Unsigned test build only. Add the existing signing key before tagging a release.'
          }
      - name: Verify signed manifest for the 2.8.1 draft
        if: github.ref == 'refs/heads/release-prep/v2.8.1'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) { throw 'Missing updater manifest' }
          if (-not (Select-String -Path dist/latest.yml -Pattern '^pocketchatSignature:' -Quiet)) { throw 'Unsigned updater manifest: aborting draft' }
      - uses: actions/upload-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release-prep/v2.8.1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: dist
      - name: Create 2.8.1 draft release with trusted Windows assets
        if: github.ref == 'refs/heads/release-prep/v2.8.1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          ## Cove 2.8.1 — Original 3D Imposter restored

          The authentic **Keel** 3D map, crewmates, camera, walkable shuttle lobby, wardrobe, original task interactions, vents, and wire-repair sabotage are back.

          ### Improvements
          - Smoother multiplayer movement with revision-based position reconciliation and player synchronization
          - Persistent named lobbies: play another round without recreating the lobby; only the host closes it
          - Automatic game opening for joined players when a new round starts
          - Emergency meeting cooldown with an on-screen timer and a record of who voted for whom
          - One persistent Kill button that selects the closest eligible in-range player, with a cooldown countdown
          - Report and sabotage controls with clear availability and countdowns
          - Host kicking and administrator deletion of any open Imposter lobby

          The game currently supports **Keel only**. More maps will come in future updates.

          ### Installation
          On Windows, use the signed installer below, or open Cove and choose **Check for updates**. Test automatic updating on an existing installation before distributing this release broadly.
          RELEASE_NOTES
          gh release create v2.8.1 \
            dist/Cove-2.8.1-Setup-x64.exe \
            dist/Cove-2.8.1-Setup-x64.exe.blockmap \
            dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target e3ff984720931c90004e7951ef6d0c66ff1df73f \
            --draft \
            --title "Cove v2.8.1 — 3D Imposter restored" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Prepare draft release for final verification
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml
