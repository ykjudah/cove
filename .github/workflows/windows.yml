name: Cove Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/setup-cove]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cove-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      POCKETCHAT_UPDATE_REPO: https://github.com/${{ github.repository }}
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check release tag and signing configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
          if (-not $env:POCKETCHAT_UPDATE_SIGNING_KEY) { throw 'Missing POCKETCHAT_UPDATE_SIGNING_KEY repository secret' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign trusted build when configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          POCKETCHAT_UPDATE_SIGNING_KEY: ${{ secrets.POCKETCHAT_UPDATE_SIGNING_KEY }}
        run: |
          if ($env:POCKETCHAT_UPDATE_SIGNING_KEY) {
            npm run sign-update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'Unsigned test build only. Add the existing signing key before tagging a release.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cove-Windows-test-build
          path: dist
      - name: Prepare draft release for final verification
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup-x64.exe
            dist/*.blockmap
            dist/latest.yml
